openapi: 3.0.3
info:
  title: 星球出机 API
  description: |
    契约快照占位文件。后端工程接入 springdoc-openapi 后，用 /v3/api-docs.yaml 导出覆盖本文件。
    全局约定（鉴权、错误体、分页、金额单位）见同级目录 ../00-接口通则.md
  version: 0.0.0

servers:
  - url: https://api.example.com/api/v1
    description: 替换为实际 API 基址（含 /api/v1）

tags:
  - name: Meta
    description: 元数据与健康检查
  - name: Auth
    description: 认证与用户
  - name: Catalog
    description: 商品与搜索
  - name: Order
    description: 订单与支付
  - name: Member
    description: 会员与钱包
  - name: Community
    description: 社区与 IM
  - name: Distribution
    description: 分销与埋点
  - name: UserCenter
    description: 我的页面、钱包、资产、消息和会员中心
  - name: 后台管理
    description: 后台管理网站接口

paths:
  /meta/ping:
    get:
      tags: [Meta]
      summary: 存活探测（示例，可与 Actuator 并存或替换）
      operationId: ping
      security: []
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: string
                    example: pong
  /auth/wechat:
    post:
      tags: [Auth]
      summary: 微信小程序一键登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: 登录成功，返回 JWT 与用户摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
  /users/me:
    get:
      tags: [UserCenter]
      summary: 当前登录用户摘要
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummaryEnvelope'
  /users/me/membership:
    get:
      tags: [UserCenter]
      summary: 当前用户会员信息
      responses:
        '200':
          description: 会员信息
  /membership/planet-cards:
    get:
      tags: [UserCenter]
      summary: 可售星球卡列表
      responses:
        '200':
          description: 星球卡列表
  /wallet:
    get:
      tags: [UserCenter]
      summary: 当前用户钱包余额
      responses:
        '200':
          description: 钱包余额，金额单位为分
  /wallet/ledger:
    get:
      tags: [UserCenter]
      summary: 当前用户钱包流水
      parameters:
        - in: query
          name: cursor
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: 钱包流水分页
  /assets/robots:
    get:
      tags: [UserCenter]
      summary: 当前用户资产列表
      responses:
        '200':
          description: 资产列表
  /assets/robots/{assetId}/dashboard:
    get:
      tags: [UserCenter]
      summary: 当前用户资产收益面板
      parameters:
        - in: path
          name: assetId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 资产收益面板
  /assets/earnings:
    get:
      tags: [UserCenter]
      summary: 当前用户托管收益汇总
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            enum: [7, 30]
            default: 7
          description: 收益趋势范围，非 30 时按 7 天返回
      responses:
        '200':
          description: 用户托管收益汇总、趋势、分类和明细，金额单位为分
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetEarningsEnvelope'
  /distribution/me:
    get:
      tags: [Distribution]
      summary: 当前用户分销信息
      responses:
        '200':
          description: 分销中心首页信息
  /distribution/team:
    get:
      tags: [Distribution]
      summary: 当前用户团队统计与成员列表
      responses:
        '200':
          description: 一级二级团队与成员明细
  /distribution/commissions:
    get:
      tags: [Distribution]
      summary: 当前用户佣金明细
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [ALL, PENDING_PROTECT, SETTLEABLE, SETTLED, DISPUTE]
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: 佣金分页列表
  /distribution/bind:
    post:
      tags: [Distribution]
      summary: 绑定邀请码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode:
                  type: string
                  maxLength: 32
      responses:
        '200':
          description: 绑定成功，已绑定时幂等成功
        '400':
          description: 邀请码为空、格式无效、邀请人不存在或不可绑定自己
  /notifications:
    get:
      tags: [UserCenter]
      summary: 当前用户消息列表
      responses:
        '200':
          description: 消息分页
  /notifications/read:
    post:
      tags: [UserCenter]
      summary: 批量标记消息已读
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        '200':
          description: 标记成功
  /catalog/filters:
    get:
      tags: [Catalog]
      summary: 商品页左侧筛选菜单
      security: []
      responses:
        '200':
          description: 启用菜单组及其选项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogFilterGroupListEnvelope'
  /catalog/skus:
    get:
      tags: [Catalog]
      summary: 商品列表
      security: []
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [RENT, BUY, SOFTWARE] } }
        - { in: query, name: brandId, schema: { type: integer, format: int64 } }
        - { in: query, name: modelId, schema: { type: integer, format: int64 } }
        - { in: query, name: minPrice, schema: { type: integer, format: int64 } }
        - { in: query, name: maxPrice, schema: { type: integer, format: int64 } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: recommended, schema: { type: boolean }, description: 仅返回后台标记为首页推荐的商品 }
      responses:
        '200':
          description: 商品分页列表
  /catalog/skus/{skuId}:
    get:
      tags: [Catalog]
      summary: 商品详情，含图片、视频、价格、服务和说明区块
      security: []
      parameters:
        - in: path
          name: skuId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 商品详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkuDetailEnvelope'
  /catalog/scenes:
    get:
      tags: [Catalog]
      summary: 首页场景应用列表，按后台排序返回图片与标签
      security: []
      responses:
        '200':
          description: 场景应用列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SceneItem' }
  /catalog/scenes/{sceneId}/bundles:
    get:
      tags: [Catalog]
      summary: 场景关联的在线商品
      security: []
      parameters:
        - { in: path, name: sceneId, required: true, schema: { type: string } }
      responses:
        '200': { description: 场景及关联商品 }
  /orders/preview:
    post:
      tags: [Order]
      summary: 计算公开商品的订单价格预览
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuId, orderType]
              properties:
                skuId: { type: integer, format: int64 }
                orderType: { type: string, enum: [RENT, BUY, SOFTWARE] }
                rentStartDate: { type: string, format: date }
                rentEndDate: { type: string, format: date }
                address: { type: string }
                couponDiscountMinor: { type: integer, format: int64, minimum: 0, description: 优惠券抵扣金额，单位为分，后端按应付金额封顶 }
                lightYearDiscountMinor: { type: integer, format: int64, minimum: 0, description: 光年币抵扣金额，单位为分，后端按应付金额封顶 }
      responses:
        '200':
          description: 金额单位为分的计价结果，包含抵扣明细
  /orders:
    post:
      tags: [Order]
      summary: 创建当前用户订单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuId, orderType]
              properties:
                skuId: { type: integer, format: int64 }
                orderType: { type: string, enum: [RENT, BUY, SOFTWARE] }
                rentStartDate: { type: string, format: date }
                rentEndDate: { type: string, format: date }
                address: { type: string }
                couponDiscountMinor: { type: integer, format: int64, minimum: 0, description: 优惠券抵扣金额，单位为分，后端按应付金额封顶 }
                lightYearDiscountMinor: { type: integer, format: int64, minimum: 0, description: 光年币抵扣金额，单位为分，后端按应付金额封顶 }
                idempotencyKey: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 创建成功，返回订单；金额字段单位均为分
        '400':
          description: 参数无效或价格未配置
  /orders/{orderId}/payments/wechat-jsapi:
    post:
      tags: [Order]
      summary: 获取当前用户订单的微信小程序支付参数
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 返回 timeStamp、nonceStr、package、signType、paySign
        '403':
          description: 订单不属于当前用户
        '409':
          description: 订单不可支付
  /orders/{orderId}/contract/download-url:
    get:
      tags: [Order]
      summary: 获取当前用户订单合同下载地址
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 返回合同预签名下载地址和过期时间
        '403':
          description: 订单不属于当前用户
        '404':
          description: 合同不存在
  /config/activities:
    get:
      tags: [Catalog]
      summary: 已发布且当前有效的活动列表
      security: []
      responses:
        '200':
          description: 活动列表
  /config/activities/{id}:
    get:
      tags: [Catalog]
      summary: 活动详情
      security: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 活动详情
  /admin/upload/image:
    post:
      tags: [后台管理]
      summary: 后台上传图片
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 上传成功，返回可直接访问的图片地址
  /admin/upload/video:
    post:
      tags: [后台管理]
      summary: 后台上传活动视频
      description: 支持 MP4、MOV、M4V、WebM 视频文件，单文件不超过 200MB；小程序播放优先使用 MP4/H.264。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 上传成功，返回可直接访问的视频地址
  /admin/catalog-filters:
    get:
      tags: [后台管理]
      summary: 管理商品筛选菜单
      responses:
        '200': { description: 菜单列表 }
    post:
      tags: [后台管理]
      summary: 创建商品筛选菜单组及选项
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCatalogFilterUpsert' }
      responses:
        '200': { description: 创建成功 }
  /admin/catalog-filters/{id}:
    put:
      tags: [后台管理]
      summary: 更新商品筛选菜单组及选项
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCatalogFilterUpsert' }
      responses:
        '200': { description: 更新成功 }
    delete:
      tags: [后台管理]
      summary: 删除商品筛选菜单组
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 删除成功 }
  /admin/brands:
    get:
      tags: [后台管理]
      summary: 品牌主数据列表
      responses:
        '200':
          description: 品牌列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandListEnvelope'
    post:
      tags: [后台管理]
      summary: 创建品牌主数据
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBrandUpsert' }
      responses:
        '200': { description: 创建成功 }
  /admin/brands/{id}:
    put:
      tags: [后台管理]
      summary: 更新品牌主数据
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBrandUpsert' }
      responses:
        '200': { description: 更新成功 }
    delete:
      tags: [后台管理]
      summary: 删除品牌主数据
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 删除成功 }
  /admin/activities:
    get:
      tags: [后台管理]
      summary: 活动详情管理列表
      responses:
        '200': { description: 活动分页列表 }
    post:
      tags: [后台管理]
      summary: 创建活动详情
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminActivityUpsert' }
      responses:
        '200': { description: 创建成功 }
  /admin/activities/{id}:
    get:
      tags: [后台管理]
      summary: 活动编辑详情
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 活动详情 }
    put:
      tags: [后台管理]
      summary: 更新活动详情
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminActivityUpsert' }
      responses:
        '200': { description: 更新成功 }
    delete:
      tags: [后台管理]
      summary: 删除活动
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 删除成功 }
  /admin/scenes:
    get:
      tags: [后台管理]
      summary: 首页场景应用管理列表
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: 场景应用分页列表 }
    post:
      tags: [后台管理]
      summary: 新增首页场景应用
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSceneUpsert' }
      responses:
        '200': { description: 创建成功 }
  /admin/scenes/{id}:
    put:
      tags: [后台管理]
      summary: 更新首页场景应用图片、标签和排序
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSceneUpsert' }
      responses:
        '200': { description: 更新成功 }
    delete:
      tags: [后台管理]
      summary: 删除首页场景应用
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 删除成功 }
  /admin/skus:
    get:
      tags: [后台管理]
      summary: 后台商品列表
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, enum: [RENT, BUY, SOFTWARE] }
        - in: query
          name: status
          schema: { type: string, enum: [ON_SHELF, OFF_SHELF] }
      responses:
        '200':
          description: 商品分页
    post:
      tags: [后台管理]
      summary: 后台新增商品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSkuUpsert'
      responses:
        '200':
          description: 新增成功
  /admin/skus/{id}:
    get:
      tags: [后台管理]
      summary: 后台商品详情
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 商品详情
    put:
      tags: [后台管理]
      summary: 后台编辑商品
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSkuUpsert'
      responses:
        '200':
          description: 保存成功
  /admin/skus/{id}/toggle-shelf:
    post:
      tags: [后台管理]
      summary: 后台切换商品上下架
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 切换成功
  /admin/skus/{id}/toggle-recommend:
    post:
      tags: [后台管理]
      summary: 切换商品在首页推荐区的展示状态
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 返回当前推荐状态
  /admin/community/posts:
    get:
      tags: [后台管理]
      summary: 后台社区帖子列表
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: status
          schema: { type: string, enum: [AUDITING, APPROVED, REJECTED, MANUAL_REVIEW, REVOKED] }
        - in: query
          name: circleId
          schema: { type: integer, format: int64 }
        - in: query
          name: keyword
          schema: { type: string }
      responses:
        '200':
          description: 帖子分页
  /admin/community/posts/{id}/revoke:
    post:
      tags: [后台管理]
      summary: 后台撤销帖子
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 撤销成功
  /admin/community/posts/{id}/restore:
    post:
      tags: [后台管理]
      summary: 后台恢复帖子
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 恢复成功
  /admin/community/posts/{id}/pin:
    post:
      tags: [后台管理]
      summary: 后台置顶帖子
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 置顶成功
  /admin/community/posts/{id}/unpin:
    post:
      tags: [后台管理]
      summary: 后台取消置顶帖子
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 取消成功
  /admin/community/topics:
    get:
      tags: [后台管理]
      summary: 后台社区话题列表
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: keyword
          schema: { type: string }
      responses:
        '200':
          description: 话题分页
  /admin/community/topics/{id}/revoke:
    post:
      tags: [后台管理]
      summary: 后台撤销话题下的可见帖子
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 撤销成功
  /admin/community/topics/{id}/restore:
    post:
      tags: [后台管理]
      summary: 后台恢复话题下已撤销帖子
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 恢复成功
  /admin/community/analytics:
    get:
      tags: [后台管理]
      summary: 后台社区运营数据
      responses:
        '200':
          description: 社区运营统计、趋势和热门帖子

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 小程序登录后获得的 accessToken
  schemas:
    LoginResponseEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            accessToken: { type: string }
            expiresIn: { type: integer, format: int64 }
            user:
              $ref: '#/components/schemas/UserSummary'
    UserSummaryEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        avatarUrl: { type: string }
        membershipLevel: { type: integer }
        isNativeResident: { type: boolean }
    AssetEarningsEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: '#/components/schemas/AssetEarnings'
    AssetEarnings:
      type: object
      properties:
        totalRevenueMinor: { type: integer, format: int64, description: 累计收益，单位为分 }
        pendingRevenueMinor: { type: integer, format: int64, description: 待结算收益，单位为分 }
        withdrawableRevenueMinor: { type: integer, format: int64, description: 可提现收益，单位为分 }
        monthRevenueMinor: { type: integer, format: int64, description: 本月收益，单位为分 }
        trendTotalMinor: { type: integer, format: int64, description: 当前趋势范围合计收益，单位为分 }
        activeDeviceCount: { type: integer, description: 当前活跃托管设备数量 }
        updatedAt: { type: string, format: date-time }
        trend:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              amountMinor: { type: integer, format: int64 }
        categories:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              name: { type: string }
              amountMinor: { type: integer, format: int64 }
        details:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              assetId: { type: integer, format: int64 }
              assetName: { type: string }
              assetImageUrl: { type: string }
              type: { type: string }
              amountMinor: { type: integer, format: int64 }
              status: { type: string }
              createdAt: { type: string, format: date-time }
    CatalogFilterGroupListEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: '#/components/schemas/CatalogFilterGroup' }
    CatalogFilterGroup:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        title: { type: string }
        filterField: { type: string, enum: [BRAND_ID, PRICE_RANGE, MODEL_ID, KEYWORD] }
        options:
          type: array
          items: { $ref: '#/components/schemas/CatalogFilterOption' }
    CatalogFilterOption:
      type: object
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        value: { type: string }
        minPriceMinor: { type: integer, format: int64, description: 金额单位为分 }
        maxPriceMinor: { type: integer, format: int64, description: 金额单位为分 }
        sortOrder: { type: integer }
    SceneItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        sortOrder: { type: integer }
        tags: { type: array, items: { type: string } }
    BrandListEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: '#/components/schemas/Brand' }
    Brand:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        logoUrl: { type: string }
        sortOrder: { type: integer }
    AdminBrandUpsert:
      type: object
      required: [name]
      properties:
        name: { type: string }
        logoUrl: { type: string }
        sortOrder: { type: integer }
    SkuDetailEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/SkuDetail' }
    SkuDetail:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        subtitle: { type: string }
        brand: { type: string }
        type: { type: string, enum: [RENT, BUY, SOFTWARE] }
        image: { type: string }
        priceAmount: { type: integer, format: int64, description: 金额单位为分 }
        originalPriceMinor: { type: integer, format: int64, description: 金额单位为分 }
        stock: { type: integer }
        adaptedScenesText: { type: string }
        stockStatusText: { type: string }
        deliveryText: { type: string }
        specs: { type: object, additionalProperties: { type: string } }
        tags: { type: array, items: { type: string } }
        mediaItems:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              type: { type: string, enum: [IMAGE, VIDEO] }
              sortOrder: { type: integer }
        prices:
          type: array
          items:
            type: object
            properties:
              priceType: { type: string, enum: [DAILY_RENT, LEASE_BUY, BUY, SUBSCRIPTION] }
              priceMinor: { type: integer, format: int64 }
              minDuration: { type: integer }
              maxDuration: { type: integer }
        services: { type: array, items: { type: object } }
        detailSections: { type: array, items: { type: object } }
    AdminCatalogFilterUpsert:
      type: object
      required: [code, title, filterField, options]
      properties:
        code: { type: string }
        title: { type: string }
        filterField: { type: string, enum: [BRAND_ID, PRICE_RANGE, MODEL_ID, KEYWORD] }
        sortOrder: { type: integer }
        enabled: { type: boolean }
        options:
          type: array
          items: { $ref: '#/components/schemas/CatalogFilterOption' }
    AdminActivityUpsert:
      type: object
      required: [title, startAt, status]
      properties:
        title: { type: string }
        subtitle: { type: string }
        tag: { type: string }
        coverUrl: { type: string }
        videoUrl: { type: string }
        description: { type: string }
        linkUrl: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        sortOrder: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED, OFFLINE] }
        content: { type: array, items: { type: object } }
    AdminSceneUpsert:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 50 }
        description: { type: string }
        imageUrl: { type: string, maxLength: 512 }
        sortOrder: { type: integer, minimum: 0 }
        tags: { type: array, maxItems: 4, items: { type: string } }
        skuIds:
          type: array
          description: 该场景关联展示的商品 SKU ID 列表
          items: { type: integer, format: int64 }
    AdminSkuUpsert:
      type: object
      required: [name, type, priceFen]
      properties:
        name: { type: string }
        brand: { type: string }
        brandId: { type: integer, format: int64 }
        type: { type: string, enum: [RENT, BUY, SOFTWARE] }
        priceFen: { type: integer, format: int64, description: 金额单位为分 }
        specs: { type: string }
        models: { type: string }
        coverImage: { type: string }
        subtitle: { type: string }
        stock: { type: integer, minimum: 0 }
        originalPriceMinor: { type: integer, format: int64, description: 金额单位为分 }
        adaptedScenesText: { type: string }
        stockStatusText: { type: string }
        deliveryText: { type: string }
        media: { type: array, items: { type: object } }
        prices: { type: array, items: { type: object } }
        tags: { type: array, items: { type: string } }
        services: { type: array, items: { type: object } }
        detailSections: { type: array, items: { type: object } }

security:
  - bearerAuth: []

