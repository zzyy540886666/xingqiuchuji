<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>星球出机小程序预览页面 Figma 导入</title>
    <script src="./capture.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 3200px;
        background: #f5f5f5;
      }

      body {
        padding: 0;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }

      .canvas {
        display: grid;
        grid-template-columns: 853px 941px 940px;
        align-items: start;
        gap: 160px 227px;
        width: max-content;
        padding: 0;
      }

      .preview {
        display: block;
        width: var(--w);
        height: var(--h);
        object-fit: fill;
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <img class="preview" src="./1.%E9%A6%96%E9%A1%B5.jpg" style="--w: 853px; --h: 1844px" />
      <img class="preview" src="./2.%20%E5%88%86%E7%B1%BB%20%E3%80%81%E5%95%86%E5%93%81%E8%B4%A7%E6%9E%B6%E9%A1%B5.png" style="--w: 528px; --h: 1096px" />
      <img class="preview" src="./3.%20%E6%90%9C%E7%B4%A2%E9%A1%B5.png" style="--w: 568px; --h: 1238px" />
      <img class="preview" src="./4.%20%E5%95%86%E5%93%81%E8%AF%A6%E6%83%85%E9%A1%B5.png" style="--w: 875px; --h: 1798px" />
      <img class="preview" src="./5.%E4%B8%8B%E5%8D%95%E3%80%81%E6%94%AF%E4%BB%98%E7%A1%AE%E8%AE%A4%E9%A1%B5.png" style="--w: 941px; --h: 1672px" />
      <img class="preview" src="./6.%20%E8%AE%A2%E5%8D%95%E4%B8%AD%E5%BF%83%E9%A1%B5.png" style="--w: 540px; --h: 1130px" />
      <img class="preview" src="./7.%20%E7%A4%BE%E5%8C%BA%20Feed%20%E9%A1%B5.png" style="--w: 878px; --h: 1792px" />
      <img class="preview" src="./8.%E6%88%91%E7%9A%84%E3%80%81%E4%B8%AA%E4%BA%BA%E4%B8%AD%E5%BF%83%E9%A1%B5.png" style="--w: 940px; --h: 1672px" />
      <img class="preview" src="./9.%E4%BC%9A%E5%91%98%E3%80%81%E6%98%9F%E7%90%83%E5%8D%A1%E9%A1%B5.png" style="--w: 940px; --h: 1672px" />
      <img class="preview" src="./10.%E9%92%B1%E5%8C%85%E3%80%81%E5%85%89%E5%B9%B4%E5%B8%81%E9%A1%B5.png" style="--w: 940px; --h: 1672px" />
      <img class="preview" src="./11.%E5%88%86%E8%BA%AB%E8%B5%84%E4%BA%A7%E3%80%81%E6%89%98%E7%AE%A1%E7%9C%8B%E6%9D%BF%E9%A1%B5.png" style="--w: 460px; --h: 946px" />
      <img class="preview" src="./12.%20%E5%88%86%E9%94%80%E4%B8%AD%E5%BF%83%E9%A1%B5.png" style="--w: 544px; --h: 1036px" />
    </main>
    <script>
      (async () => {
        const hash = new URLSearchParams(location.hash.slice(1));
        const captureId = hash.get("figmacapture");
        const endpoint = hash.get("figmaendpoint");
        if (!captureId || !endpoint) return;

        await Promise.all(
          [...document.images].map((img) => {
            if (img.complete && img.naturalWidth > 0) return Promise.resolve();
            return new Promise((resolve, reject) => {
              img.addEventListener("load", resolve, { once: true });
              img.addEventListener("error", reject, { once: true });
            });
          }),
        );

        for (let i = 0; i < 80; i += 1) {
          if (window.figma && window.figma.captureForDesign) break;
          await new Promise((resolve) => setTimeout(resolve, 250));
        }

        if (window.figma && window.figma.captureForDesign) {
          await window.figma.captureForDesign({
            captureId,
            endpoint,
            selector: "body",
          });
        }
      })();
    </script>
  </body>
</html>
