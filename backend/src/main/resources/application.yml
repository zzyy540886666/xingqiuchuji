server:
  port: 8080

spring:
  application:
    name: xingqiu-server
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  sql:
    init:
      mode: always
      continue-on-error: true
      encoding: UTF-8
      data-locations: classpath:seed-data.sql,classpath:seed-unitree-demo.sql
  datasource:
    url: jdbc:mysql://localhost:3306/xingqiu_dev?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&sessionVariables=character_set_client=utf8mb4,character_set_connection=utf8mb4,character_set_results=utf8mb4&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:xingqiu123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:redis123}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

mybatis-plus:
  mapper-locations: classpath*:/mappers/**/*.xml
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:false}
  default-produces-media-type: application/json

xingqiu:
  config:
    version: 1
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-1234}
    expiration-seconds: 7200
  wechat:
    mini-program:
      app-id: ${WX_APP_ID:}
      app-secret: ${WX_APP_SECRET:}
    pay:
      mch-id: ${WX_PAY_MCH_ID:}
      merchant-serial-no: ${WX_PAY_MERCHANT_SERIAL_NO:}
      api-v3-key: ${WX_PAY_API_V3_KEY:}
      private-key-path: ${WX_PAY_PRIVATE_KEY_PATH:/tmp/apiclient_key.pem}
      platform-public-key-path: ${WX_PAY_PLATFORM_PUBLIC_KEY_PATH:}
      notify-url: ${WX_PAY_NOTIFY_URL:http://localhost:8080/api/v1/internal/pay/wechat/notify}
  cos:
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:}
  tms:
    secret-id: ${TMS_SECRET_ID:}
    secret-key: ${TMS_SECRET_KEY:}
    region: ${TMS_REGION:ap-guangzhou}

logging:
  level:
    com.xingqiu.server: INFO
    org.springframework.security: WARN
