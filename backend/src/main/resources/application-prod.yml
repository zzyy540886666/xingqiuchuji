# ============================================================
# 生产环境配置
# 使用方式: java -jar xingqiu-server.jar --spring.profiles.active=prod
# ============================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      password: ${REDIS_PASSWORD}

xingqiu:
  jwt:
    secret: ${JWT_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.xingqiu.server: INFO
    org.springframework.security: WARN
