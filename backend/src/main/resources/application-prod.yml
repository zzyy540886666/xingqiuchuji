# ============================================================
# 生产环境配置
# 使用方式: java -jar xingqiu-server.jar --spring.profiles.active=prod
# ============================================================

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/xingqiu?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.xingqiu.server: INFO
    org.springframework.security: WARN
