<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" aria-hidden="true">
  <!-- 太阳/星球主体 -->
  <circle cx="40" cy="40" r="24" fill="url(#planet-grad)" />
  
  <!-- 星环 1 (后半部分) -->
  <path d="M 10,48 C 20,28 60,18 70,30" fill="none" stroke="#e34d59" stroke-width="2" opacity="0.4" stroke-linecap="round" />
  
  <!-- 星环 2 (前半部分，加粗且不透明) -->
  <path d="M 70,30 C 80,42 40,62 10,48" fill="none" stroke="#ff7a45" stroke-width="3" stroke-linecap="round" />

  <!-- 环上的高光点 -->
  <circle cx="20" cy="50" r="2" fill="#fff" />
  <circle cx="65" cy="35" r="1.5" fill="#fff" />

  <defs>
    <linearGradient id="planet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb067" />
      <stop offset="50%" stop-color="#ff7a45" />
      <stop offset="100%" stop-color="#e34d59" />
    </linearGradient>
  </defs>
</svg>
