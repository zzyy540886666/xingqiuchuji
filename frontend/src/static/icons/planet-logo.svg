<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="planetGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="30%" stop-color="#FF8F00" />
      <stop offset="70%" stop-color="#D84315" />
      <stop offset="100%" stop-color="#870000" />
    </radialGradient>
    
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#F57C00" />
    </linearGradient>
  </defs>

  <g transform="translate(50, 50) rotate(-22) translate(-50, -50)">
    <!-- Back Ring (top half) -->
    <path d="M 6 50 A 44 12 0 0 0 94 50" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    
    <!-- Planet -->
    <circle cx="50" cy="50" r="28" fill="url(#planetGrad)" />
    
    <!-- Craters -->
    <circle cx="38" cy="38" r="4.5" fill="#BF360C" opacity="0.3" />
    <circle cx="60" cy="58" r="3" fill="#BF360C" opacity="0.3" />
    <circle cx="42" cy="62" r="3.5" fill="#BF360C" opacity="0.3" />

    <!-- Front Ring (bottom half) -->
    <path d="M 2 50 A 48 14 0 0 1 98 50" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Inner bright ring -->
    <path d="M 8 50 A 42 10 0 0 1 92 50" fill="none" stroke="#FFF8E1" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
